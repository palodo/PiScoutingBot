version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: pi-scouting-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist data, logs, and reports
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reportes:/app/reportes
      - ./debug_html:/app/debug_html
    # Optional: memory limits
    mem_limit: 1g
    mem_reservation: 512m
